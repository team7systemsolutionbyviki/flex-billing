<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - T7 PRINT BILLING</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-main);
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            text-align: center;
            margin: 1rem;
        }
        .login-logo {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            text-shadow: var(--clay-btn);
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--text-main);
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
            padding: 0.85rem;
            font-size: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-logo">
            <i class="ri-printer-cloud-fill"></i>
        </div>
        <h2 class="login-title">T7-PRINT-BILLING</h2>
        <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">WELCOME BACK</p>
        
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="ri-login-box-line"></i> Login</button>
        </form>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Init theme
        const currentTheme = localStorage.getItem('t7theme') || 'light';
        document.body.setAttribute('data-theme', currentTheme);

        // Simple Toast function for login page
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'error' ? 'ri-error-warning-line' : 'ri-information-line';
            toast.innerHTML = `
                <div class="toast-icon"><i class="${icon}"></i></div>
                <div class="toast-content">
                    <div class="toast-title">${type === 'error' ? 'Error' : 'Notification'}</div>
                    <div class="toast-message">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function downloadBackup(type) {
            const customPath = localStorage.getItem('t7_data_path') || '';
            const urlParams = customPath ? `?path=${encodeURIComponent(customPath)}` : '';
            
            try {
                // Fetch full state from backend
                const response = await fetch(`http://localhost:3000/api/data${urlParams}`);
                if (!response.ok) return;
                const resData = await response.json();
                const data = resData.data || {};
                
                if(Object.keys(data).length > 0) {
                    const now = new Date();
                    const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                    const timeStr = String(now.getHours()).padStart(2, '0') + '-' + String(now.getMinutes()).padStart(2, '0') + '-' + String(now.getSeconds()).padStart(2, '0');
                    const filename = `T7-PRINT-BACKUP-${type}-${dateStr}_${timeStr}.json`;
                    const contentStr = JSON.stringify(data, null, 2);
                    const targetPath = customPath || 'C:/T7-Backups';

                    try {
                        const backupResponse = await fetch('http://localhost:3000/api/backup', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ path: targetPath, filename: filename, content: contentStr })
                        });
                        if (backupResponse.ok) return; // Saved silently!
                    } catch(e) {}

                    // Fallback to browser download
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(contentStr);
                    const dlAnchorElem = document.createElement('a');
                    dlAnchorElem.setAttribute("href", dataStr);
                    dlAnchorElem.setAttribute("download", filename);
                    document.body.appendChild(dlAnchorElem);
                    dlAnchorElem.click();
                    document.body.removeChild(dlAnchorElem);
                }
            } catch(e) {}
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // Check credentials (including super admin viki)
            let authSuccess = false;
            let loggedInUser = user;

            if (user.toLowerCase() === 'viki' && pass.toLowerCase() === 'viki1101') {
                authSuccess = true;
                loggedInUser = 'viki';
            } else {
                try {
                    const customPath = localStorage.getItem('t7_data_path') || '';
                    const urlParams = customPath ? `?path=${encodeURIComponent(customPath)}` : '';
                    const response = await fetch(`http://localhost:3000/api/data${urlParams}`);
                    if(response.ok) {
                        const resData = await response.json();
                        const customUsers = resData.data.users || [];
                        const foundUser = customUsers.find(u => u.username === user && u.password === pass);
                        if (foundUser) {
                            authSuccess = true;
                            loggedInUser = foundUser.username;
                        }
                    }
                } catch(e) {}
            }

            if(authSuccess) {
                localStorage.setItem('t7_logged_in', loggedInUser);
                showToast('Login successful! Downloading backup...', 'success');
                downloadBackup('LOGIN');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showToast('Invalid username or password', 'error');
            }
        });
    </script>
</body>
</html>
